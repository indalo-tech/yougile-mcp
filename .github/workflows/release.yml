name: Release

# Push a tag vX.Y.Z (matching __version__ in src/yougile_mcp/__init__.py) to publish a
# GitHub Release with the CHANGELOG.md section and the built package attached.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Tag matches the package version
        run: |
          version=$(uv run --no-project python -c "import re,pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/yougile_mcp/__init__.py').read_text()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match __version__ $version"; exit 1
          fi
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - name: Release notes from CHANGELOG.md
        run: uv run --no-project python scripts/release_notes.py "$GITHUB_REF_NAME" > notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
