name: Release

# Push a tag vX.Y.Z (matching __version__ in src/yougile_mcp/__init__.py) to publish a GitHub
# Release with the CHANGELOG.md section and the built package attached, and — once PyPI
# Trusted Publishing is set up and the repository variable PUBLISH_PYPI is "true" — the same
# package on PyPI. "Run workflow" with an existing tag republishes it (e.g. to PyPI later).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.2.0"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Tag matches the package version
        run: |
          version=$(uv run --no-project python -c "import re,pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/yougile_mcp/__init__.py').read_text()).group(1))")
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG does not match __version__ $version"; exit 1
          fi
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - name: Release notes from CHANGELOG.md
        run: uv run --no-project python scripts/release_notes.py "$TAG" > dist-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/
            dist-notes.md

  github-release:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - name: Publish GitHub Release (skipped if it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes-file dist-notes.md --verify-tag
          fi

  pypi:
    needs: build
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/project/yougile-mcp/
    permissions:
      id-token: write  # Trusted Publishing: no API token stored anywhere
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          # A re-run for a tag already on PyPI (to check the pipeline, or to finish a release
          # whose other job failed) passes instead of failing on "file already exists".
          skip-existing: true
